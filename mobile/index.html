<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nokaba, versions mobiles</title>
  <style>
    :root {
      --fond: #ece2d4;
      --encre: #241d18;
      --secondaire: #5f5348;
      --filet: #cfc2b0;
      --accent: #ab4f30;
      --bordeaux: #400021;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--encre);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.5rem;
      padding: 1rem clamp(1rem, 3vw, 2.5rem);
      background: rgba(236, 226, 212, 0.94);
      border-bottom: 1px solid var(--filet);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0;
      font: 400 1.4rem/1.2 Georgia, "Times New Roman", serif;
    }
    h1 span { color: var(--accent); }
    .note { margin: 0; flex: 1 1 18rem; color: var(--secondaire); font-size: 0.875rem; }
    .reglages { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }
    .groupe { display: inline-flex; border: 1px solid var(--filet); border-radius: 5px; overflow: hidden; }
    .groupe button {
      padding: 0.4rem 0.8rem;
      border: 0;
      background: transparent;
      color: var(--secondaire);
      font: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
    }
    .groupe button + button { border-left: 1px solid var(--filet); }
    .groupe button[aria-pressed="true"] { background: var(--encre); color: #fdfbf7; }
    main {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem 2rem;
      padding: 2rem clamp(1rem, 3vw, 2.5rem) 4rem;
    }
    figure { margin: 0; }
    figcaption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.6rem;
      font: 400 1.05rem/1.2 Georgia, "Times New Roman", serif;
    }
    figcaption a { color: var(--accent); font: 500 0.75rem/1 -apple-system, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    .telephone {
      padding: 12px;
      border-radius: 38px;
      background: var(--bordeaux);
      box-shadow: 0 30px 60px -35px rgba(64, 0, 33, 0.8);
    }
    iframe {
      display: block;
      height: 760px;
      border: 0;
      border-radius: 26px;
      background: #fff;
    }
    @media (max-width: 500px) {
      main { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Nokaba <span>versions mobiles</span></h1>
    <p class="note">Chaque page s’affiche comme sur un téléphone. Faites défiler à l’intérieur de chaque écran ; "Ouvrir" l’affiche en entier.</p>
    <div class="reglages">
      <div class="groupe" role="group" aria-label="Langue">
        <button type="button" data-langue="fr" aria-pressed="true">Français</button>
        <button type="button" data-langue="en" aria-pressed="false">English</button>
      </div>
      <div class="groupe" role="group" aria-label="Largeur">
        <button type="button" data-largeur="320" aria-pressed="false">320</button>
        <button type="button" data-largeur="375" aria-pressed="false">375</button>
        <button type="button" data-largeur="390" aria-pressed="true">390</button>
        <button type="button" data-largeur="430" aria-pressed="false">430</button>
      </div>
    </div>
  </header>
  <main data-ecrans></main>
  <script>
    const P = '/nokaba-apercu-pdo3r8';
    const PAGES = {
      fr: [
        ['Accueil', '/'],
        ['Création web', '/creation-web/'],
        ['Conseil', '/conseil/'],
        ['Mon approche', '/approche/'],
        ['Portfolio', '/belhavre/'],
        ['À propos', '/a-propos/'],
        ['Contact', '/contact/'],
      ],
      en: [
        ['Home', '/en/'],
        ['Web design', '/en/web-design/'],
        ['Consulting', '/en/consulting/'],
        ['My approach', '/en/approach/'],
        ['Portfolio', '/en/belhavre/'],
        ['About', '/en/about/'],
        ['Contact', '/en/contact/'],
      ],
    };
    let langue = 'fr';
    let largeur = 390;
    const zone = document.querySelector('[data-ecrans]');
    const dessiner = () => {
      zone.innerHTML = PAGES[langue]
        .map(([nom, chemin]) => `<figure>
          <figcaption>${nom}<a href="${P}${chemin}" target="_blank" rel="noopener">${langue === 'fr' ? 'Ouvrir' : 'Open'}</a></figcaption>
          <div class="telephone"><iframe src="${P}${chemin}" title="${nom}" loading="lazy" style="width:${largeur}px"></iframe></div>
        </figure>`)
        .join('');
    };
    const choisir = (attribut, valeur) =>
      document.querySelectorAll(`[${attribut}]`).forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute(attribut) === valeur)));
    document.querySelectorAll('[data-langue]').forEach((b) =>
      b.addEventListener('click', () => { langue = b.dataset.langue; choisir('data-langue', langue); dessiner(); }));
    document.querySelectorAll('[data-largeur]').forEach((b) =>
      b.addEventListener('click', () => {
        largeur = Number(b.dataset.largeur);
        choisir('data-largeur', b.dataset.largeur);
        zone.querySelectorAll('iframe').forEach((cadre) => (cadre.style.width = `${largeur}px`));
      }));
    dessiner();
  </script>
</body>
</html>
